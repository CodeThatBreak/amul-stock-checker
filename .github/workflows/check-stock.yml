name: Check Amul Stock

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron can lag a few minutes
    # under load — don't rely on this for sub-10-min precision.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check-stock.js  